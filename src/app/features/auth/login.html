
<div class="login-page" dir="rtl">
  <div class="login-card">

    <div class="logo">
      <span>📚</span>
      <h1>ASBABI</h1>
    </div>

    <h2>مرحباً بعودتك</h2>
    <p class="subtitle">سجل دخولك للوصول إلى مكتبتك</p>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="example@email.com"
          required />
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>

        <div class="password-wrapper">
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="أدخل كلمة المرور"
            required />

          <button
            type="button"
            class="eye-button"
            (click)="passwordVisible = !passwordVisible"
            [attr.aria-label]="passwordVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'">

            @if (passwordVisible) {
              <svg viewBox="0 0 24 24">
                <path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A11 11 0 0121 12a11.5 11.5 0 01-3.1 4.2M6.2 6.2A11.5 11.5 0 003 12s3 7 9 7a9.8 9.8 0 004-.8"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }

          </button>
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-message">
          <strong>تعذر تسجيل الدخول</strong>
          <p>{{ errorMessage }}</p>
        </div>
      }

      <button
        type="submit"
        class="submit-button"
        [disabled]="loading">

        @if (loading) {
          جارٍ تسجيل الدخول...
        } @else {
          تسجيل الدخول
        }

      </button>

    </form>

    <div class="register-link">
      ليس لديك حساب؟
      <a routerLink="/register">إنشاء حساب جديد</a>
    </div>

    <a routerLink="/" class="back-home">العودة إلى الرئيسية</a>

  </div>
</div>
